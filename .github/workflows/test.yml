name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка библиотек
        run: pip install -r requirements.txt
      - name: Тесты ядра и бота
        run: python -m unittest discover tests -v
      - name: Бот импортируется без ошибок
        run: |
          BOT_TOKEN= DB_PATH=":memory:" python -c "import bot"
      - name: Установка FFmpeg
        timeout-minutes: 10
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Тесты монтажа (стили, хук, кроп по лицу, раскадровка)
        run: python -m unittest tests.test_media -v
      - name: Пробный монтаж на тестовом видео
        run: |
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 \
            -t 120 -c:v libx264 -preset ultrafast -c:a aac -shortest /tmp/src.mp4
          python clip.py /tmp/src.mp4 --fake --no-llm --clips 2 --unique strong --out /tmp/out
          python clip.py /tmp/src.mp4 --fake --times "0:10-0:25, 1:00-1:15" --out /tmp/out/manual
          python clip.py /tmp/src.mp4 --times "30-40" --no-subs --layout crop --out /tmp/out/nosubs
          python clip.py /tmp/src.mp4 --fake --times "0:40-0:50" --style neon --position middle --watermark @test_bot --out /tmp/out/styled
          ls -la /tmp/out
      - uses: actions/upload-artifact@v4
        with:
          name: test-shorts
          path: /tmp/out/**/*.mp4
          retention-days: 3
