<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Разметка фрагментов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f2f5);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #2f80ed);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 14px 14px 90px; background: var(--bg2); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 19px; margin: 2px 2px 2px; }
  .sub { color: var(--hint); font-size: 13px; margin: 0 2px 12px; }
  .player-box { background: #000; border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; }
  .player-box .ratio { position: relative; padding-top: 56.25%; }
  .player-box iframe, #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .now { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 64px; }
  button {
    font: inherit; border: 0; border-radius: 10px; padding: 9px 12px; cursor: pointer;
    background: var(--bg); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); padding: 6px 8px; }
  button:disabled { opacity: .45; cursor: default; }
  .grow { flex: 1; }
  .card {
    background: var(--bg); border-radius: var(--radius); padding: 12px; margin-bottom: 10px;
    border: 2px solid transparent; transition: border-color .15s;
  }
  .card.active { border-color: var(--accent); }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .card-title { font-weight: 600; }
  .times { display: flex; gap: 8px; align-items: flex-end; }
  .field { flex: 1; }
  .field label { display: block; font-size: 12px; color: var(--hint); margin: 0 0 4px 2px; }
  .field input {
    width: 100%; font: 600 22px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums; text-align: center; padding: 10px 6px;
    border-radius: 10px; border: 1.5px solid var(--bg2); background: var(--bg2); color: var(--text); outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--hint); opacity: .45; font-weight: 500; }
  .field input.bad { border-color: var(--danger); }
  .dash { padding-bottom: 12px; color: var(--hint); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .chip { font-size: 13px; padding: 6px 10px; background: var(--bg2); }
  .info { font-size: 13px; color: var(--hint); margin-left: auto; }
  .err { color: var(--danger); font-size: 13px; margin-top: 6px; min-height: 0; }
  .add { width: 100%; padding: 12px; background: var(--bg); color: var(--accent); font-weight: 600; }
  .fallback-send { position: fixed; left: 14px; right: 14px; bottom: 14px; padding: 14px; display: none; }
  .hint-box { font-size: 13px; color: var(--hint); margin: 12px 2px; }
</style>
</head>
<body>
  <h1>✂️ Разметка фрагментов</h1>
  <p class="sub" id="sub"></p>

  <div id="video-block" hidden>
    <div class="player-box"><div class="ratio"><div id="player"></div></div></div>
    <div class="player-controls">
      <span class="now" id="now">0:00</span>
      <button class="primary grow" id="set-start">⏺ Начало</button>
      <button class="primary grow" id="set-end">⏹ Конец</button>
    </div>
  </div>

  <div id="list"></div>
  <button class="add" id="add">＋ Добавить фрагмент</button>
  <p class="hint-box" id="hint">
    Вводи время цифрами: <b>1124</b> станет <b>11:24</b>, <b>12030</b> — <b>1:20:30</b>.
  </p>
  <button class="primary fallback-send" id="fallback-send">Нарезать</button>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);
  const q = new URLSearchParams(location.search);
  const MAX_COUNT = clampInt(q.get("max"), 1, 10, 10);   // сколько фрагментов можно (остаток лимита)
  const MAX_LEN = clampInt(q.get("maxlen"), 5, 600, 180); // максимальная длина фрагмента, сек
  const VIDEO_ID = /^[\w-]{6,20}$/.test(q.get("v") || "") ? q.get("v") : "";
  const DURATION = parseFloat(q.get("dur")) || 0;

  const fragments = [{ start: "", end: "" }];
  let active = 0;
  let player = null;

  function clampInt(v, lo, hi, def) {
    const n = parseInt(v, 10);
    return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def;
  }

  // «11:24» -> 684, «1:02:03» -> 3723, «95» -> 95. Неверное — NaN.
  function parseTime(text) {
    text = String(text).trim().replace(/[.,]/g, ":");
    if (!/^\d+(:\d{1,2}){0,2}$/.test(text)) return NaN;
    const parts = text.split(":").map(Number);
    if (parts.slice(1).some(p => p >= 60)) return NaN;
    return parts.reduce((acc, p) => acc * 60 + p, 0);
  }

  function fmt(t) {
    t = Math.max(0, Math.round(t));
    const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    const ss = String(s).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
  }

  // Набранные цифры превращаем в время: 1124 -> 11:24, 12030 -> 1:20:30
  function normalize(text) {
    text = String(text).trim();
    if (!text) return "";
    if (/^\d{3,6}$/.test(text)) {
      const d = text.padStart(text.length <= 4 ? 4 : 6, "0");
      text = d.length === 4 ? `${d.slice(0, 2)}:${d.slice(2)}` : `${d.slice(0, 2)}:${d.slice(2, 4)}:${d.slice(4)}`;
    }
    const t = parseTime(text);
    return Number.isNaN(t) ? text : fmt(t);
  }

  function check(f) {
    const s = parseTime(f.start), e = parseTime(f.end);
    if (f.start === "" && f.end === "") return { empty: true };
    if (Number.isNaN(s)) return { error: "Неверное время начала", field: "start" };
    if (Number.isNaN(e)) return { error: f.end === "" ? "Укажи конец" : "Неверное время конца", field: "end" };
    if (e <= s) return { error: "Конец должен быть позже начала", field: "end" };
    if (e - s > MAX_LEN) return { error: `Не длиннее ${fmt(MAX_LEN)}`, field: "end" };
    if (DURATION && s >= DURATION) return { error: `Видео длится ${fmt(DURATION)}`, field: "start" };
    return { ok: true, start: s, end: e };
  }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    fragments.forEach((f, i) => {
      const card = document.createElement("div");
      card.className = "card" + (i === active ? " active" : "");
      card.innerHTML = `
        <div class="card-head">
          <span class="card-title">Фрагмент ${i + 1}</span>
          ${fragments.length > 1 ? '<button class="ghost" data-del>Удалить</button>' : ""}
        </div>
        <div class="times">
          <div class="field"><label>Начало</label>
            <input data-k="start" inputmode="numeric" placeholder="0:00" autocomplete="off"></div>
          <div class="dash">—</div>
          <div class="field"><label>Конец</label>
            <input data-k="end" inputmode="numeric" placeholder="0:00" autocomplete="off"></div>
        </div>
        <div class="chips">
          <button class="chip" data-len="15">+15 с</button>
          <button class="chip" data-len="30">+30 с</button>
          <button class="chip" data-len="60">+1 мин</button>
          ${VIDEO_ID ? '<button class="chip" data-seek>▶ Смотреть</button>' : ""}
          <span class="info"></span>
        </div>
        <div class="err"></div>`;
      card.querySelectorAll("input").forEach(inp => {
        const k = inp.dataset.k;
        inp.addEventListener("focus", () => { if (active !== i) { active = i; markActive(); } });
        inp.addEventListener("input", () => { f[k] = inp.value; updateMain(); });
        // обновляем только эту карточку, чтобы не сбить фокус при переходе в соседнее поле
        inp.addEventListener("change", () => { f[k] = normalize(inp.value); refresh(card, f); });
        inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
      });
      card.addEventListener("click", e => {
        if (e.target.closest("input")) return;
        if (active !== i) { active = i; markActive(); }
      });
      const del = card.querySelector("[data-del]");
      if (del) del.onclick = e => {
        e.stopPropagation();
        fragments.splice(i, 1);
        active = Math.min(active, fragments.length - 1);
        haptic("light");
        render();
      };
      card.querySelectorAll("[data-len]").forEach(btn => btn.onclick = e => {
        e.stopPropagation();
        const s = parseTime(f.start);
        if (Number.isNaN(s)) { haptic("error"); return; }
        f.end = fmt(s + Number(btn.dataset.len));
        active = i; markActive(); haptic("light"); refresh(card, f);
      });
      const seek = card.querySelector("[data-seek]");
      if (seek) seek.onclick = e => {
        e.stopPropagation();
        const s = parseTime(f.start);
        if (player && !Number.isNaN(s)) { player.seekTo(s, true); player.playVideo(); }
      };
      refresh(card, f);
      list.appendChild(card);
    });
    document.getElementById("add").disabled = fragments.length >= MAX_COUNT;
    updateMain();
  }

  function refresh(card, f) {
    const r = check(f);
    card.querySelectorAll("input").forEach(inp => {
      const k = inp.dataset.k;
      if (document.activeElement !== inp || inp.value !== f[k]) inp.value = f[k];
      inp.classList.toggle("bad", r.field === k && f[k] !== "");
    });
    card.querySelector(".info").textContent = r.ok ? "⏱ " + fmt(r.end - r.start) : "";
    card.querySelector(".err").textContent = r.error || "";
    updateMain();
  }

  function markActive() {
    document.querySelectorAll(".card").forEach((c, i) => c.classList.toggle("active", i === active));
  }

  function ready() {
    const checked = fragments.map(check);
    if (checked.some(r => r.error)) return null;
    const ok = checked.filter(r => r.ok);
    return ok.length ? ok.map(r => [r.start, r.end]) : null;
  }

  function updateMain() {
    const ranges = ready();
    const text = ranges ? `Нарезать: ${ranges.length} ${plural(ranges.length)}` : "Заполни тайминги";
    if (inTelegram) {
      tg.MainButton.setText(text);
      ranges ? tg.MainButton.enable() : tg.MainButton.disable();
      tg.MainButton.color = ranges ? tg.themeParams.button_color || "#2f80ed" : "#9aa0a6";
      tg.MainButton.show();
    } else {
      const b = document.getElementById("fallback-send");
      b.style.display = "block"; b.textContent = text; b.disabled = !ranges;
    }
  }

  function plural(n) {
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return "фрагмент";
    if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return "фрагмента";
    return "фрагментов";
  }

  function send() {
    const ranges = ready();
    if (!ranges) { haptic("error"); return; }
    const data = JSON.stringify({ v: 1, ranges });
    if (inTelegram) {
      haptic("success");
      tg.sendData(data); // Telegram закроет окно и передаст данные боту
    } else {
      document.getElementById("hint").textContent = "Данные для бота: " + data;
    }
  }

  function haptic(kind) {
    if (!inTelegram || !tg.HapticFeedback) return;
    if (kind === "light") tg.HapticFeedback.impactOccurred("light");
    else tg.HapticFeedback.notificationOccurred(kind);
  }

  // --- плеер YouTube: можно смотреть и ставить метки кнопками ---
  function setupPlayer() {
    document.getElementById("video-block").hidden = false;
    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player("player", {
        videoId: VIDEO_ID,
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
      });
      setInterval(() => {
        if (player && player.getCurrentTime) {
          document.getElementById("now").textContent = fmt(player.getCurrentTime() || 0);
        }
      }, 250);
    };
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);

    const mark = key => {
      if (!player || !player.getCurrentTime) return;
      const t = Math.floor(player.getCurrentTime());
      const f = fragments[active];
      f[key] = fmt(t);
      if (key === "start" && f.end !== "" && parseTime(f.end) <= t) f.end = "";
      // поставили конец — следующий клик «Начало» пойдёт в новый фрагмент
      if (key === "end" && check(f).ok && active === fragments.length - 1 && fragments.length < MAX_COUNT) {
        fragments.push({ start: "", end: "" });
        active = fragments.length - 1;
      }
      haptic("light");
      render();
    };
    document.getElementById("set-start").onclick = () => mark("start");
    document.getElementById("set-end").onclick = () => mark("end");
  }

  document.getElementById("add").onclick = () => {
    if (fragments.length >= MAX_COUNT) return;
    const last = check(fragments[fragments.length - 1]);
    fragments.push({ start: last.ok ? fmt(last.end) : "", end: "" });
    active = fragments.length - 1;
    haptic("light");
    render();
    const inputs = document.querySelectorAll(".card.active input");
    (inputs[0].value ? inputs[1] : inputs[0]).focus();
  };
  document.getElementById("fallback-send").onclick = send;

  document.getElementById("sub").textContent =
    `До ${MAX_COUNT} ${plural(MAX_COUNT)}, каждый не длиннее ${fmt(MAX_LEN)}` +
    (VIDEO_ID ? ". Включи видео и ставь метки кнопками." : ".");

  if (inTelegram) {
    tg.ready();
    tg.expand();
    tg.MainButton.onClick(send);
  }
  if (VIDEO_ID) setupPlayer();
  render();
})();
</script>
</body>
</html>
